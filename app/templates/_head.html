{# 公共 head 片段：base.html 与不继承 base 的独立页（登录页）共用，避免两处漂移 #}
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script>
  /* 尽早标记：只有在允许动效时才启用「滚动揭示」的初始隐藏态，
     避免用户在系统里开启「减少动态效果」后内容被藏起来。
     内联执行，因此即使 app.js 加载失败，内容也不会停在不可见状态。 */
  (function () {
    var root = document.documentElement;
    try {
      if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        root.classList.add('anim');
      }
    } catch (err) { /* 忽略：退化为无动效 */ }

    /* 看门狗：html.anim 会把 .reveal 置为透明，只有 app.js 跑起来才会
       逐个揭示。万一 app.js 没加载成功（网络、语法错误、被拦），整页
       内容就会一直不可见 —— 这里兜一道底，2.5 秒内没等到 app.js 的
       anim-ready 就把 anim 摘掉，宁可不做动效，也不能看不见内容。 */
    setTimeout(function () {
      if (!root.classList.contains('anim-ready')) root.classList.remove('anim');
    }, 2500);
  })();
</script>
<link rel="stylesheet" href="/static/css/app.css" />
{# 无 JS 兜底：翻面卡的正反面叠在同一格里，背面转了 180° 且 backface 隐藏，
   没有脚本就永远读不到背面。这里把两面改回正常流上下排开、去掉翻面按钮，
   正反内容都直接可读 —— 知识库是「读」的页面，不该因为脚本没跑就少一半。 #}
<noscript>
  <style>
    .flip-inner { display: block; height: auto; transform: none !important; }
    .flip-face {
      grid-area: auto;
      transform: none !important;
      backface-visibility: visible;
      -webkit-backface-visibility: visible;
    }
    .flip-front { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
    .flip-back {
      margin-top: -1px;
      border-top-left-radius: 0;
      border-top-right-radius: 0;
    }
    .flip-btn { display: none; }
    .person-card { min-height: 0; }
  </style>
</noscript>
